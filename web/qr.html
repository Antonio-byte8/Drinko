<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drinko · QR dei tavoli</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="qr-lib.js"></script>
<style>
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:720px;margin:0 auto;width:100%}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.form .wide{grid-column:1/-1}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tag{background:#fff;color:#111;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;break-inside:avoid;page-break-inside:avoid;text-align:center}
.tag svg{width:100%;height:auto;display:block}
.tag b{font-family:var(--display);font-size:22px}
.tag .club-name{font-size:13px;color:#444}
.tag .hint{font-size:12px;color:#444}
@media print{
  body{background:#fff;color:#000;padding:0}
  .no-print{display:none!important}
  .sheet-grid{grid-template-columns:repeat(3,1fr);gap:10mm}
  .tag{border:1px solid #bbb;border-radius:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print wrap">
    <h1 style="font-family:var(--display)">QR dei tavoli</h1>
    <p class="note">Scegli il locale e i tavoli, poi stampa. Ogni QR apre il menu del locale già sul tavolo giusto. Metti anche un QR per il bancone.</p>
    <div class="form">
      <label class="wide">Indirizzo del sito<input class="input" id="base" autocomplete="off"></label>
      <label>Nome corto del locale<input class="input" id="club" value="aurora" autocomplete="off"></label>
      <label>Nome da mostrare<input class="input" id="name" value="Club Aurora" autocomplete="off"></label>
      <label>Dal tavolo<input class="input" id="from" type="number" min="1" max="999" value="1"></label>
      <label>Al tavolo<input class="input" id="to" type="number" min="1" max="999" value="20"></label>
      <label class="wide" style="flex-direction:row;align-items:center;gap:10px"><input id="counter" type="checkbox" checked style="width:18px;height:18px;accent-color:var(--accent)"> Aggiungi anche il QR per il bancone</label>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="pay" id="print" type="button">Stampa</button>
    </div>
  </div>
  <div class="sheet-grid" id="grid"></div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  $('base').value = location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function qrSvg(text) {
    var q = new QRCodeLib.QRCode(-1, QRCodeLib.QRErrorCorrectLevel.M);
    q.addData(text); q.make();
    var n = q.getModuleCount(), pad = 4, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + pad) + ' ' + (r + pad) + 'h1v1h-1z';
    var size = n + pad * 2;
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }
  function tag(url, title, name) {
    return '<div class="tag" data-url="' + esc(url) + '">' + qrSvg(url) + '<b>' + esc(title) + '</b><span class="club-name">' + esc(name) + '</span><span class="hint">Inquadra per ordinare e pagare</span></div>';
  }
  function draw() {
    var base = $('base').value.trim(); if (base && !/\/$/.test(base)) base += '/';
    var club = $('club').value.trim().toLowerCase(), name = $('name').value.trim() || club;
    var from = Math.max(1, parseInt($('from').value, 10) || 1), to = Math.min(999, Math.max(from, parseInt($('to').value, 10) || from));
    var out = [];
    if ($('counter').checked) out.push(tag(base + 'index.html?club=' + encodeURIComponent(club), 'Bancone', name));
    for (var t = from; t <= to; t++) out.push(tag(base + 'index.html?club=' + encodeURIComponent(club) + '&table=' + t, 'Tavolo ' + t, name));
    $('grid').innerHTML = out.join('');
  }
  ['base', 'club', 'name', 'from', 'to', 'counter'].forEach(function (id) { $(id).addEventListener('input', draw); $(id).addEventListener('change', draw); });
  $('print').addEventListener('click', function () { window.print(); });
  draw();
})();
</script>
</body>
</html>
